    aplicaTema: function () {
      Cau.set('tema', 'clar');
      document.documentElement.setAttribute('data-tema', 'clar');
    },

    temaActual: function () { return 'clar'; }
  };

  /* LES DUES SORTIDES D'UNA PANTALLA D'ERROR, ESCOLTADES UN SOL COP.
     Cada vista es cus el seu «Torna-ho a provar», que és seu i ha de ser-ho:
     només ella sap què tornar a demanar. Aquestes dues no són de ningú en
     particular —connectar i tornar a l'índex volen dir el mateix a tot
     arreu—, i posar-les a cada vista seria copiar-les setze vegades. */
  document.addEventListener('click', function (ev) {
    var connecta = ev.target.closest && ev.target.closest('[data-connecta-ara]');
    if (connecta) { App.connecta(); return; }
    var inici = ev.target.closest && ev.target.closest('[data-va-inici]');
    if (inici) { App.ves(INICI, {}); return; }

    /* I «TORNA-HO A PROVAR» TAMBÉ, PEL MATEIX MOTIU.
       Cada vista se'l cusia pel seu compte i quatre se'l van deixar: el
       calendari, el dia, el diari i les finances pintaven el botó i no
       l'escoltava ningú. El premies i no passava res, que és pitjor que no
       tenir-lo. Ara viu aquí, un sol cop, com els altres dos. */
    var torna = ev.target.closest && ev.target.closest('[data-reintenta]');
    if (torna) App.refresca();
  });

  document.addEventListener('keydown', function (ev) {
    var fosc = document.getElementById('fosc');
    if (fosc.dataset.obert !== '1') return;

    if (ev.key === 'Escape') { App.tancaModal(); return; }

    /* EL FOCUS NO POT SORTIR DEL QUE HI HA OBERT.
       Amb el calaix de preguntar obert, tres tabulacions ja et deixaven als
       botons de la pantalla del darrere —tapada per la cortina i sense poder
       tocar-la amb el dit—, i des d allà podies recórrer tota l app sense
       veure on eres. Escape ja el tancava bé i el focus ja tornava al botó
       que l havia obert; el que faltava era això. */
    if (ev.key !== 'Tab') return;
    var dins = fosc.querySelectorAll(
      'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), ' +
      'textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
    var visibles = [];
    for (var i = 0; i < dins.length; i++) {
      var r = dins[i].getBoundingClientRect();
      if (r.width > 0 && r.height > 0) visibles.push(dins[i]);
    }
    if (!visibles.length) return;
    var primer = visibles[0], ultim = visibles[visibles.length - 1];
    var on = document.activeElement;
    if (!fosc.contains(on)) { ev.preventDefault(); (ev.shiftKey ? ultim : primer).focus(); return; }
    if (ev.shiftKey && on === primer) { ev.preventDefault(); ultim.focus(); }
    else if (!ev.shiftKey && on === ultim) { ev.preventDefault(); primer.focus(); }
  });

  return { App: App, Comp: Comp, Cau: Cau, Cua: Cua, crida: crida, escriu: escriu,
           esc: esc, ic: ic, fmt: fmt, Servidor: Servidor, dinsAppsScript: dinsAppsScript };
})();

var App = Jefe.App, Comp = Jefe.Comp, Cau = Jefe.Cau, Cua = Jefe.Cua;
var crida = Jefe.crida, escriu = Jefe.escriu;
var esc = Jefe.esc, ic = Jefe.ic, fmt = Jefe.fmt;
var Servidor = Jefe.Servidor, dinsAppsScript = Jefe.dinsAppsScript;
</script>

<script>
/* =========================================================================
   JEFE — notificacions al mòbil (client)

   Demana permís, obté la fitxa del dispositiu i la registra al servidor.
   A partir d'aquí JEFE et pot escriure encara que l'app estigui tancada.

   Es carrega SOLA i mai bloqueja: si Firebase no està configurat, si el
   navegador no en té, o si no hi ha xarxa, l'app funciona igual i el botó
   diu per què no.
   ========================================================================= */

var Notificacions = (function () {

  var SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
  var NO_CONFIG = 'Els avisos només funcionen des de la pàgina publicada, ' +
                  'no des de la finestra d\'Apps Script. Obre l\'app des de ' +
                  'la seva adreça de sempre i torna-ho a provar.';
  var config = null, missatgeria = null, carregant = null;

  function potSerHi() {
    return 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;
  }

  function permis() {
    return potSerHi() ? Notification.permission : 'unsupported';
  }

  /** Carrega el SDK i la configuració. Un sol cop, encara que es cridi deu vegades. */
  function prepara() {
    if (carregant) return carregant;

    /* SI EL FITXER NO HI ÉS, DIGUES-HO EN CRISTIÀ.
       Aquesta pàgina se serveix des de dos llocs i només un té el fitxer al
       costat: des d'Apps Script, `firebase.config.json` no existeix i la
       resposta és la pàgina d'error del servidor. `r.json()` peta amb
       «Unexpected non-whitespace character after JSON at position 4», i això
       era el que sortia a la pantalla en tocar «Activa els avisos»: un
       missatge de l'intèrpret de JavaScript, no una explicació. */
    carregant = fetch('firebase.config.json', { cache: 'no-cache' })
      .then(function (r) {
        if (!r.ok) throw new Error(NO_CONFIG);
        return r.json().catch(function () { throw new Error(NO_CONFIG); });
      })
      .then(function (cfg) {
        if (!cfg.apiKey || cfg.apiKey.indexOf('POSA-HI') === 0) {
          throw new Error('Firebase encara no està configurat. Vegeu docs/03-notificacions.md');
        }
        config = cfg;
        return Promise.all([guio(SDK + 'firebase-app-compat.js'),
                            guio(SDK + 'firebase-messaging-compat.js')]);
      })
      .then(function () {
        firebase.initializeApp({
          apiKey: config.apiKey,
          projectId: config.projectId,
          messagingSenderId: config.messagingSenderId,
          appId: config.appId
        });
        missatgeria = firebase.messaging();

        // Missatge rebut amb l'app OBERTA: no el pinta el sistema, el pintem
        // nosaltres perquè no passi desapercebut enmig de la conversa.
        missatgeria.onMessage(function (m) {
          var d = (m && m.data) || {};
          App.brindis((d.titol ? d.titol + ': ' : '') + (d.cos || 'Notificació'));
        });
        return true;
      });

    return carregant;
  }

  function guio(url) {
    return new Promise(function (ok, ko) {
      var s = document.createElement('script');
      s.src = url; s.async = true;
      s.onload = ok;
      s.onerror = function () { ko(new Error('No s\'ha pogut carregar ' + url)); };
      document.head.appendChild(s);
    });
  }

  /**
   * Demana permís i registra el dispositiu.
   * El permís s'ha de demanar SEMPRE des d'un toc: si no, Chrome el denega
   * sense preguntar i et quedes sense poder-ho tornar a intentar.
   */
  function activa() {
    if (!potSerHi()) {
      return Promise.reject(new Error('Aquest navegador no pot rebre notificacions.'));
    }

    return Notification.requestPermission()
      .then(function (p) {
        if (p !== 'granted') {
          throw new Error(p === 'denied'
            ? 'Has denegat les notificacions. Per tornar-hi: cadenat de la barra d\'adreces → Notificacions → Permet.'
            : 'No has respost a la petició de permís.');
        }
        return prepara();
      })
      .then(function () {
        // Treballador propi per a les notificacions, amb abast separat del
        // de l'app: un abast només pot tenir un treballador.
        return navigator.serviceWorker.register('firebase-messaging-sw.js', { scope: './fcm/' });
      })
      .then(function (reg) {
        return navigator.serviceWorker.ready.then(function () { return reg; });
      })
      .then(function (reg) {
        return missatgeria.getToken({ vapidKey: config.vapidKey, serviceWorkerRegistration: reg });
      })
      .then(function (fitxa) {
        if (!fitxa) throw new Error('Firebase no ha donat cap fitxa per a aquest dispositiu.');
        return crida('nucli', 'registraDispositiu', { fitxa: fitxa, nom: nomDispositiu() });
      })
      .then(function () {
        Cau.set('notificacions', true);
        return true;
      });
  }

  function nomDispositiu() {
    var ua = navigator.userAgent;
    var sistema = /Android/i.test(ua) ? 'Android'
                : /iPhone|iPad/i.test(ua) ? 'iPhone'
                : /Windows/i.test(ua) ? 'Windows'
                : /Mac/i.test(ua) ? 'Mac' : 'Desconegut';
    var instalada = matchMedia('(display-mode: standalone)').matches;
    return sistema + (instalada ? ' · app instal·lada' : ' · navegador');
  }

  /** Estat per a la pantalla, sense demanar res ni carregar res. */
  function estat() {
    return {
      potSerHi: potSerHi(),
      permis: permis(),
      activades: permis() === 'granted' && Cau.get('notificacions', false)
    };
  }

  /**
   * Cada cop que obres l'app, si ja tens el permís donat:
   *
   *   1. Torna a registrar el treballador de servei. És l'única manera que
   *      una versió nova hi entri: el registre només es fa en prémer el botó,
   *      i pel seu compte Chrome només ho mira un cop al dia. Sense això pots
   *      estar-te hores provant la versió d'abans sense cap senyal.
   *
   *   2. TORNA A APUNTAR LA FITXA DEL DISPOSITIU AL FULL. I això és el que
   *      falla si no hi és: la fitxa d'FCM no és per sempre. Es renova sola
   *      —quan netegis les dades del lloc, quan reinstal·lis l'app, o quan a
   *      Firebase li sembla—, i el dia que es renova, la que hi ha desada al
   *      full deixa de servir. Des de fora no es veu res: els avisos
   *      senzillament deixen d'arribar, i no te n'assabentes fins que en
   *      trobes a faltar un. Tornar-la a apuntar cada cop que obres l'app fa
   *      que això es curi sol.
   *
   *      Al full és un «desa» per fitxa, o sigui que no s'hi acumula res: si
   *      és la mateixa, només se'n refresca la data.
   */
  function actualitza() {
    if (!potSerHi() || Notification.permission !== 'granted') return;

    navigator.serviceWorker.register('firebase-messaging-sw.js', { scope: './fcm/' })
      .then(function (reg) {
        reg.update();
        return prepara().then(function () { return reg; });
      })
      .then(function (reg) {
        return missatgeria.getToken({ vapidKey: config.vapidKey, serviceWorkerRegistration: reg });
      })
      .then(function (fitxa) {
        if (!fitxa) return;
        // Si és la mateixa que ja vam apuntar, no cal molestar el servidor.
        if (Cau.get('fitxa', '') === fitxa) return;
        return crida('nucli', 'registraDispositiu', { fitxa: fitxa, nom: nomDispositiu() })
          .then(function () { Cau.set('fitxa', fitxa); Cau.set('notificacions', true); });
      })
      .catch(function () { /* sense xarxa o sense clau: ja hi tornarem demà */ });
  }

  /* Passats uns segons de l'arrencada, no durant.
     Ara això baixa el SDK de Firebase per poder demanar la fitxa, i el que
     mana en obrir l'app és que la primera pantalla surti de seguida. Cinc
     segons més tard no els nota ningú, i la fitxa es refresca igual. */
  setTimeout(actualitza, 5000);

  return { potSerHi: potSerHi, permis: permis, estat: estat, activa: activa,
           actualitza: actualitza };
})();
</script>

<script>
/* FINANCES — la pantalla
   Món: «el tall del mes», germà de Nutrició i del cos (vegeu DESIGN.md).

   LA DECISIÓ QUE MANA, i és la seva pròpia: apuntar una despesa ha de ser
   instantani. Per això el botó d'apuntar és el primer que es veu i el
   formulari s'omple sol amb el que ja has apuntat abans —la majoria de
   compres es repeteixen, i tornar a teclejar «Mercadona · Alimentació ·
   targeta» cada dimarts és exactament la fricció que fa abandonar l'eina.

   El mes es llegeix com un terreny: els ingressos són l'altura de partida,
   les despeses el que baixes, i el balanç la cota on acabes. */

App.registraVista('finances', {
  render: function (arrel, params) {

    var mes = params.mes || null;          // AAAA-MM; null = mes en curs
    var periode = params.periode || 'mes'; // mes | mesos | estad
    var dades = null, cats = [], sugg = [];

    var r0 = function (n) { return Math.round(Number(n) || 0); };
    var num = function (v) {
      var n = parseFloat(String(v === undefined || v === null ? '' : v).replace(',', '.'));
      return isFinite(n) ? Math.abs(n) : 0;
    };
    function eur(n, ambSigne) {
      var v = Math.round((Number(n) || 0) * 100) / 100;
      var s = Math.abs(v).toFixed(2).replace('.', ',') + ' €';
      if (!ambSigne) return (v < 0 ? '−' : '') + s;
      return (v > 0 ? '+' : v < 0 ? '−' : '') + s;
    }
    /* Nomes el numero. L'euro va a la ranura d'unitat: enganxat al numero es
       una paraula mes, i quan no hi cap el navegador el trenca i te'l deixa
       en una linia tot sol. */
    function eurNum(n, ambSigne) {
      var v = Math.round((Number(n) || 0) * 100) / 100;
      var t = Math.abs(v).toFixed(2).replace('.', ',');
      if (!ambSigne) return (v < 0 ? '−' : '') + t;
      return (v > 0 ? '+' : v < 0 ? '−' : '') + t;
    }

    function nomMes(m) {
      var d = new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)) - 1, 1);
      var t = d.toLocaleDateString('ca-ES', { month: 'long', year: 'numeric' });
      return t.charAt(0).toUpperCase() + t.slice(1);
    }
    function mouMes(m, n) {
      var y = Number(m.slice(0, 4)), i = Number(m.slice(5, 7)) - 1 + n;
      var d = new Date(y, i, 1);
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
    }

    // ------------------------------------------------------------- capçalera

    var PERIODES = [['mes', 'Mes'], ['mesos', 'Mesos'], ['estad', 'Estadístiques']];

    /* UNA SOLA LÍNIA.
       Abans hi havia la fila de la data i, a sota, una tira amb els tres
       períodes: dues files fixes a dalt de tot per dir-te on ets. El títol ja
       ho diu, i tocant-lo tries. El que es canvia cinc cops al dia —el mes—
       té les fletxes al costat; el que es canvia un cop a la setmana no s'ha
       de menjar una franja de pantalla per estar sempre a la vista. */
    function capcalera(esActual) {
      var mostraFletxes = periode === 'mes' || periode === 'estad';
      var titol = periode === 'mesos' ? 'Últims 12 mesos'
                : periode === 'revisar' ? 'Per classificar'
                : periode === 'recurrents' ? 'Cada mes'
                : periode === 'patrimoni' ? 'Patrimoni'
                : nomMes(mes);
      var sota = periode === 'revisar' ? 'safata'
               : periode === 'recurrents' ? 'recurrents'
               : periode === 'patrimoni' ? 'que tens'
               : (PERIODES.filter(function (p) { return p[0] === periode; })[0] || ['', 'Mes'])[1];

      /* LA MARCA A DALT I EL PERÍODE A SOTA. No hi ha botó de tornar: l'app
         és aquesta pantalla, i el full índex de JEFE ja no existeix. */
      return '<header class="capcalera">' +
        '<div class="cap-fila">' +
          '<span class="marca">' + ic('finances') + '<span class="gravat tinta">Finances</span></span>' +
          '<div class="cap-accions">' +
          /* El «+» de la capçalera NOMÉS on no hi ha el botó gros.
             A la pantalla del mes, «Apunta un moviment» ja és just a sota del
             balanç i a amplada sencera: tenir-hi a més una creueta petita a
             dalt que fa exactament el mateix no dona cap opció, només fa
             dubtar de si són dues coses diferents. A la resta de pantalles
             —els mesos, les estadístiques, la safata— el botó gros no hi és,
             i sense la creueta et quedaries sense manera d'apuntar res. */
          (periode === 'mes' ? '' :
            '<button class="btn btn-fantasma btn-icona" data-apunta="1" aria-label="Apunta un moviment">' +
              ic('mes') + '</button>') +
          '<button class="btn btn-fantasma btn-icona" data-ajustos="1" aria-label="Categories i importació">' +
            ic('ajust') + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="cap-periode' + (mostraFletxes ? '' : ' sense-fletxes') + '">' +
          (mostraFletxes
            ? '<button class="btn btn-fantasma btn-icona" data-salt="-1" aria-label="Mes anterior">' +
              ic('esquerra') + '</button>' : '') +
          '<h1><button class="titol-periode" data-obre-periode="1" aria-haspopup="dialog" aria-label="' +
            esc(titol + '. Tria què vols veure') + '">' +
            '<b>' + esc(titol) + '</b>' +
            '<span class="gravat">' + esc(sota) + (esActual && periode === 'mes' ? ' · en curs' : '') +
              ic('avall') + '</span>' +
          '</button></h1>' +
          /* AQUÍ HI HAVIA «Banc mirat fa 3 minuts», i s'ha tret.
             L'argument era que el número de sota només vol dir alguna cosa si
             saps de quan és. Amb tres sincronitzacions al dia i el fitxer
             sempre al dia, la resposta és sempre «fa una estona»: una línia
             que diu el mateix cada vegada no informa de res, i en canvi
             s'espremia el títol del període i les fletxes al mòbil.
             De quan és l'última mirada al banc segueix sortint a
             `diagnostic()`, que és on es va a mirar quan de debò importa. */
          (mostraFletxes
            ? '<button class="btn btn-fantasma btn-icona" data-salt="1" aria-label="Mes següent"' +
              (esActual ? ' disabled' : '') + '>' + ic('dreta') + '</button>' : '') +
        '</div>' +
      '</header>';
    }

    function obrePeriode() {
      var cos = App.modal('Què vols veure', '<div class="tria-periode">' +
        PERIODES.map(function (p) {
          return '<button data-va="' + p[0] + '"' +
                 (p[0] === periode ? ' aria-current="true"' : '') + '>' + p[1] + '</button>';
        }).join('') +
        '<button data-va="recurrents"' + (periode === 'recurrents' ? ' aria-current="true"' : '') +
          '>Cada mes</button>' +
        '<button data-va="patrimoni"' + (periode === 'patrimoni' ? ' aria-current="true"' : '') +
          '>Patrimoni</button>' +
        '<hr><button data-avui="1">Anar al mes actual</button>' +
      '</div>');

      cos.querySelectorAll('[data-va]').forEach(function (b) {
        b.addEventListener('click', function () {
          App.tancaModal();
          App.ves('finances', { mes: mes, periode: b.dataset.va });
        });
      });
      cos.querySelector('[data-avui]').addEventListener('click', function () {
        App.tancaModal();
        /* SEMPRE AL MES, I NO AL PERÍODE ON ERES.
           Abans es conservava el període: si el premies des de «Últims 12
           mesos», de «Patrimoni» o de «Cada mes» —que no tenen mes— no es
           veia passar res, i des de fora això és un botó que no va. El que
           diu l'etiqueta és «anar al mes actual», i això és el que ha de fer:
           el mes en curs, a la vista del mes. */
        App.ves('finances', { mes: null, periode: 'mes' });
      });
    }

    // ------------------------------------------------------------ vista mes

    function pintaMes(d) {
      dades = d; mes = d.mes;
      var esActual = d.mes === new Date().toISOString().slice(0, 7);

      /* A l'escriptori, dues columnes: el que diu com va el mes a l'esquerra,
         quiet, i la llista a la dreta. Al mòbil, una sola columna en aquest
         mateix ordre. */
      arrel.innerHTML = capcalera(esActual) +
        '<div class="pagina pagina-mes">' +
          '<div class="mes-esquerra">' + cridaInstallar() + cridaAvisos() + blocBalanc(d, esActual) + '</div>' +
          '<div class="mes-dreta">' + blocMoviments(d) + blocCategories(d) + '</div>' +
        '</div>';

      lligaCapcalera();
      lligaMoviments();
      lligaInstallar();
      lligaAvisos();
    }

    /* INSTAL·LAR-LA AMB EL BOTÓ DE LA PÀGINA.
       El menú de Chrome, al mòbil d'en Pol, diu «ja està instal·lada» i només
       deixa crear una drecera quan al domini ja hi ha una altra app. El botó de
       la pàgina crida la instal·lació del navegador directament i sí que
       funciona. Surt només si el navegador diu que es pot instal·lar i l'app no
       s'ha obert ja des de la icona. */
    function cridaInstallar() {
      if (!window.__potInstallar) return '';
      if (window.matchMedia && matchMedia('(display-mode: standalone)').matches) return '';
      return '<section class="crida-avisos" aria-label="Instal·lar l\'app">' +
        ic('finances') +
        '<div>' +
          '<b>Instal·la l\'app en aquest aparell</b>' +
          '<p>Amb aquest botó i no amb el menú del navegador: s\'obrirà sola, a pantalla completa, des de la seva icona.</p>' +
          '<button class="btn btn-primari" data-installa>Instal·la l\'app</button>' +
        '</div>' +
      '</section>';
    }

    function lligaInstallar() {
      var b = arrel.querySelector('[data-installa]');
      if (!b) return;
      b.addEventListener('click', function () {
        var avis = window.__potInstallar;
        if (!avis) return;
        b.dataset.carregant = '1';
        avis.prompt();
        avis.userChoice.then(function (r) {
          /* L'avís només es pot fer servir un cop: si diu que no, el navegador
             en tornarà a enviar un altre més endavant. */
          window.__potInstallar = null;
          if (r && r.outcome === 'accepted') App.brindis('Instal·lant l\'app…');
          var c = b.closest('.crida-avisos');
          if (c) c.remove();
        }).catch(function () {
          b.dataset.carregant = '0';
        });
      });
    }

    /* El navegador avisa quan vol, sovint després que la pantalla ja s'hagi
       pintat: llavors s'hi afegeix el botó, sense repintar el mes. */
    function quanPotInstallar() {
      if (!arrel.isConnected || periode !== 'mes' || arrel.querySelector('[data-installa]')) return;
      var esq = arrel.querySelector('.mes-esquerra');
      if (!esq) return;
      esq.insertAdjacentHTML('afterbegin', cridaInstallar());
      lligaInstallar();
    }
    function quanInstallada() {
      var c = arrel.isConnected && arrel.querySelector('[data-installa]');
      if (c) c.closest('.crida-avisos').remove();
      if (arrel.isConnected) App.brindis('App instal·lada: ja la tens a la pantalla d\'inici');
    }
    /* Un sol oient de cada, el de l'última pantalla pintada: aquesta funció
       s'executa cada cop que canvies de mes o de període, i sense treure els
       d'abans se n'acumularien. */
    if (window.__finOients) {
      document.removeEventListener('pot-installar', window.__finOients.pot);
      document.removeEventListener('installada', window.__finOients.feta);
    }
    window.__finOients = { pot: quanPotInstallar, feta: quanInstallada };
    document.addEventListener('pot-installar', quanPotInstallar);
    document.addEventListener('installada', quanInstallada);

    /**
     * «NO REBO ELS AVISOS QUE HAURIA DE REBRE.»
     *
     * Venia de la pàgina d'inici de JEFE, i aquí no n'hi ha: l'app s'obre al
     * mes. Els avisos del banc, del patrimoni i del vigilant de rebuts només
     * arriben si aquest aparell ha donat permís, i el permís només el pots
     * donar tu i només des d'un toc. Si ja el té, això no surt.
     */
    function cridaAvisos() {
      if (!window.Notificacions || !Notificacions.potSerHi()) return '';
      var p = Notificacions.permis();
      if (p === 'granted') return '';

      var negat = p === 'denied';
      return '<section class="crida-avisos" aria-label="Avisos en aquest aparell">' +
        ic('campana') +
        '<div>' +
          '<b>Aquest aparell no rep avisos</b>' +
          '<p>' + (negat
            ? 'Has denegat les notificacions en aquest aparell. Per tornar-hi: ' +
              'si tens l\'app instal·lada, mantén premuda la icona → Informació de ' +
              'l\'app → Notificacions. Al navegador, el cadenat de la barra ' +
              'd\'adreces → Notificacions → Permet.'
            : 'Els avisos del banc, dels rebuts i del patrimoni no ' +
              'et poden arribar aquí fins que ho activis.') + '</p>' +
          (negat ? '' : '<button class="btn btn-primari" data-avisos>Activa els avisos</button>') +
        '</div>' +
      '</section>';
    }

    function lligaAvisos() {
      var b = arrel.querySelector('[data-avisos]');
      if (!b) return;
      b.addEventListener('click', function () {
        b.dataset.carregant = '1';
        Notificacions.activa()
          .then(function () {
            App.brindis('Avisos activats en aquest aparell');
            var c = arrel.querySelector('.crida-avisos');
            if (c) c.remove();
          })
          .catch(function (err) {
            b.dataset.carregant = '0';
            App.brindis(err.message, 'error');
          });
      });
    }

    function blocBalanc(d, esActual) {
      var positiu = d.balanc >= 0;
      return '<section class="balanc" data-mena="' + (positiu ? 'be' : 'avis') + '">' +
          '<p class="gravat">Balanç' + (esActual ? ' · fins avui' : '') + '</p>' +
          '<p class="balanc-v"><span class="n num">' + eurNum(d.balanc, true) + '</span>' +
            '<span class="u">€</span></p>' +
          '<p class="balanc-frase">' +
            (positiu ? 'Has estalviat ' + eur(d.balanc) + ' aquest mes.'
                     : 'Has gastat ' + eur(-d.balanc) + ' més del que has ingressat.') +
          '</p>' +
        '</section>' +

        tall(d, esActual) +

        '<div class="xifres">' +
          xifra('Ingressos', eurNum(d.ingressos), '€') +
          xifra('Despeses', eurNum(d.despeses), '€') +
          xifra('Moviments', d.moviments.length, '') +
        '</div>' +

        ((d.ritme || d.traspassos)
          ? '<div class="notes-mes">' +
            (d.ritme
              ? '<p class="menut">Portes ' + eur(d.ritme.perDia) + ' al dia. ' +
                'Si segueixes així, el mes acabarà a <b class="num">' + eur(d.ritme.projeccio) + '</b>.</p>'
              : '') +
            (d.traspassos
              ? '<p class="menut">' + eur(d.traspassos) + ' en traspassos, fora dels comptes.</p>'
              : '') +
            '</div>'
          : '') +

        (d.perClassificar
          ? '<button class="reclam" data-revisar="1">' +
              '<span class="gravat">Per classificar</span>' +
              '<b>' + d.perClassificar + (d.perClassificar === 1 ? ' moviment' : ' moviments') + '</b>' +
              '<span class="enllac">Classifica' + ic('dreta') + '</span>' +
            '</button>'
          : '') +

        '<button class="btn btn-primari btn-ple accio-gran" data-apunta="1">' +
          ic('mes') + 'Apunta un moviment</button>';
    }

    /**
     * EL TALL DEL MES: la icona, feta amb els moviments de debò.
     *
     * L'eix és el mes, de l'1 a l'últim dia. Per sobre del nivell, el que ha
     * entrat, acumulat dia a dia; per sota, el que ha sortit. Les dues línies
     * fan esglaons —un moviment és un salt, no una pendent— i es mesuren
     * contra la mateixa escala, o sigui que on acaben diu d'un cop d'ull si
     * el mes ha quedat per sobre o per sota.
     *
     * Els traspassos no hi compten, igual que no compten al balanç. Si no hi
     * ha cap moviment, les dues línies són planes: cap cim inventat.
     */
    function tall(d, esActual) {
      var W = 320, H = 132, X0 = 10, X1 = W - 10, MARGE = 6;
      var any = Number(d.mes.slice(0, 4)), m = Number(d.mes.slice(5, 7));
      var dies = new Date(any, m, 0).getDate();
      var fins = esActual ? Number(new Date().toISOString().slice(8, 10)) : dies;

      var fora = {};
      (cats || []).forEach(function (c) { if (c.exclou) fora[c.id] = true; });
      var entra = [], surt = [];
      for (var i = 0; i <= dies; i++) { entra.push(0); surt.push(0); }
      (d.moviments || []).forEach(function (x) {
        if (fora[x.categoria]) return;
        var dia = Number(String(x.data).slice(8, 10));
        if (!dia || dia > dies) return;
        if (x.tipus === 'i') entra[dia] += Math.abs(Number(x['import']) || 0);
        else surt[dia] += Math.abs(Number(x['import']) || 0);
      });
      for (var k = 1; k <= dies; k++) { entra[k] += entra[k - 1]; surt[k] += surt[k - 1]; }
      /* UNA SOLA ESCALA PER A TOTES DUES: un euro fa la mateixa alçada amunt
         que avall, perquè la gràcia és comparar-les. Per això el nivell no és
         al mig: es posa allà on hi caben totes dues senceres, com més ha
         entrat més avall. Res no s'escapça. */
      var total = entra[fins] + surt[fins];
      var esc_ = total ? (H - 2 * MARGE) / total : 0;
      var N = total ? MARGE + entra[fins] * esc_ : H / 2;

      var x = function (dia) { return X0 + (X1 - X0) * dia / dies; };
      var amunt = function (v) { return N - v * esc_; };
      var avall = function (v) { return N + v * esc_; };

      function esglaons(serie, y) {
        var p = 'M' + x(0).toFixed(1) + ' ' + y(0).toFixed(1);
        for (var i = 1; i <= fins; i++) {
          p += ' H' + x(i - 1 + 0.5).toFixed(1) + ' V' + y(serie[i]).toFixed(1);
        }
        return p + ' H' + x(fins).toFixed(1);
      }

      var dEntra = esglaons(entra, amunt), dSurt = esglaons(surt, avall);
      var marques = [1, 10, 20, dies].map(function (dia) {
        return '<line class="marca-dia" x1="' + x(dia - 0.5).toFixed(1) + '" y1="' + (N - 3) +
               '" x2="' + x(dia - 0.5).toFixed(1) + '" y2="' + (N + 3) + '"/>' +
               '<text x="' + x(dia - 0.5).toFixed(1) + '" y="' + (H + 6) + '" text-anchor="middle">' + dia + '</text>';
      }).join('');

      var resum = 'El mes en un tall: han entrat ' + eur(entra[fins]) + ' i han sortit ' + eur(surt[fins]) + '.';
      return '<svg class="tall" viewBox="0 0 ' + W + ' ' + (H + 10) + '" role="img" aria-label="' + esc(resum) + '">' +
          '<path class="entra-ombra" d="' + dEntra + ' V' + N + ' H' + x(0).toFixed(1) + 'Z"/>' +
          '<path class="surt-ombra" d="' + dSurt + ' V' + N + ' H' + x(0).toFixed(1) + 'Z"/>' +
          (esActual && fins < dies
            ? '<line class="avui" x1="' + x(fins).toFixed(1) + '" y1="4" x2="' + x(fins).toFixed(1) + '" y2="' + (H - 4) + '"/>'
            : '') +
          '<line class="nivell" x1="' + X0 + '" y1="' + N + '" x2="' + X1 + '" y2="' + N + '"/>' +
          marques +
          '<path class="entra" d="' + dEntra + '"/>' +
          '<path class="surt" d="' + dSurt + '"/>' +
        '</svg>' +
        '<p class="tall-llegenda menut" aria-hidden="true">' +
          '<span><i></i>Entra</span><span><i data-surt></i>Surt</span>' +
          (esActual && fins < dies ? '<span>Avui és el ' + fins + '</span>' : '') +
        '</p>';
    }

    function xifra(etiqueta, valor, unitat) {
      return '<div class="xifra"><span class="gravat">' + esc(etiqueta) + '</span>' +
             '<span class="xifra-gran"><span class="xifra-n num">' + esc(String(valor)) + '</span>' +
             (unitat ? '<span class="xifra-u">' + esc(unitat) + '</span>' : '') + '</span></div>';
    }

    /** Els moviments agrupats per dia, amb el subtotal del dia. */
    function blocMoviments(d) {
      if (!d.moviments.length) {
        return '<section class="seccio">' +
                 '<div class="seccio-cap"><h2>Moviments</h2></div>' +
                 '<div class="estat"><h2>Cap moviment aquest mes</h2>' +
                   '<p>Quan el banc en porti, sortiran aquí. També en pots apuntar un a mà.</p></div>' +
               '</section>';
      }

      var perDia = {}, ordre = [];
      d.moviments.forEach(function (m) {
        if (!perDia[m.data]) { perDia[m.data] = []; ordre.push(m.data); }
        perDia[m.data].push(m);
      });

      return '<section class="seccio">' +
        '<div class="seccio-cap"><h2>Moviments</h2>' +
          '<span class="menut">' + d.moviments.length + ' aquest mes</span></div>' +
        ordre.map(function (dia) {
          var llista = perDia[dia];
          var subtotal = llista.reduce(function (s, m) {
            return s + (m.tipus === 'i' ? m.import : -m.import);
          }, 0);

          return '<div class="dia">' +
            '<div class="dia-cap">' +
              '<h3 class="gravat tinta">' + esc(fmt.relativa(dia)) + '</h3>' +
              '<span class="num">' + eur(subtotal, true) + '</span>' +
            '</div>' +
            llista.map(function (m) {
              /* TOTA LA FILA OBRE EL MOVIMENT. Abans hi havia un llapis de
                 vint píxels al final de cada fila, i era l'únic lloc on es
                 podia tocar. */
              return '<button class="mov" data-edita="' + esc(m.id) + '"' +
                ' aria-label="Edita ' + esc(m.descripcio) + ', ' + (m.tipus === 'i' ? '+' : '−') + esc(eur(m.import)) + '">' +
                '<span class="mov-text">' +
                  '<span class="mov-nom">' + esc(m.emoji ? m.emoji + ' ' : '') + esc(m.descripcio) + '</span>' +
                  '<span class="mov-que">' + esc(m.categoriaNom) +
                    (m.pendent ? ' · pendent' : '') +
                    (!m.revisat ? ' · <b>per revisar</b>' : '') + '</span>' +
                '</span>' +
                '<span class="mov-import num"' + (m.tipus === 'i' ? ' data-entra' : '') + '>' +
                  (m.tipus === 'i' ? '+' : '−') + eur(m.import) +
                '</span>' +
                ic('llapis') +
              '</button>';
            }).join('') +
          '</div>';
        }).join('') +
      '</section>';
    }

    /**
     * On van els diners, i quant en tens de marge.
     *
     * El filet mesura contra el PRESSUPOST quan n'hi ha, i contra la
     * categoria més grossa quan no. Són dues preguntes diferents —«quant
     * m'he passat» i «on va més»— i cadascuna vol la seva referència.
     */
    function blocCategories(d) {
      if (!d.perCategoria.length) return '';
      var max = d.perCategoria[0].total || 1;
      var lim = {};
      (d.pressupostos || []).forEach(function (b) { lim[b.categoria] = b.limit; });

      return '<section class="seccio">' +
        '<div class="seccio-cap"><h2>On van els diners</h2></div>' +
        '<p class="menut seccio-nota">Toca una categoria per posar-hi un límit mensual.</p>' +
        '<div class="cats">' +
          d.perCategoria.map(function (c) {
            var l = lim[c.id] || 0;
            var pct = l ? Math.min(c.total / l * 100, 100) : (c.total / max * 100);
            var passat = l && c.total > l;
            return '<button class="cat-fila" data-cat="' + esc(c.id) + '"' +
              ' data-nom="' + esc(c.nom) + '" data-limit="' + l + '"' +
              ' aria-label="' + esc(c.nom) + ': ' + eur(c.total) +
                (l ? ' de ' + eur(l) + (passat ? ', passat' : '') : '') + '">' +
              '<span class="cat-nom">' + esc(c.emoji ? c.emoji + ' ' : '') + esc(c.nom) + '</span>' +
              '<span class="cat-xifra num">' + eur(c.total) +
                (l ? '<small' + (passat ? ' data-avis' : '') + '>' +
                     (passat ? 'passat · ' : '') + 'de ' + eur(l) + '</small>' : '') +
              '</span>' +
              '<span class="cat-via"' + (l ? ' data-limit="1"' : '') + ' aria-hidden="true">' +
                '<i style="width:' + pct.toFixed(1) + '%"' + (passat ? ' data-passat="1"' : '') + '></i></span>' +
            '</button>';
          }).join('') +
        '</div>' +
      '</section>';
    }

    /** El límit mensual d'una categoria. Buit o zero vol dir «sense límit». */
    function obrePressupost(idCat, nom, actual) {
      var cos = App.modal('Límit de ' + nom,
        '<div class="form-ajustos">' +
          '<p class="menut">Quant vols gastar-hi com a màxim cada mes. Deixa-ho ' +
            'buit per treure el límit.</p>' +
          '<label><span class="marge">Límit mensual (€)</span>' +
            '<input data-limit data-primer inputmode="decimal" class="num camp-import" value="' +
              (actual ? String(actual).replace('.', ',') : '') + '" autocomplete="off"></label>' +
          '<button class="btn btn-primari" data-desa-limit>Desa el límit</button>' +
        '</div>');

      cos.querySelector('[data-desa-limit]').addEventListener('click', function () {
        var b = this;
        b.disabled = true;
        escriu('finances', 'pressupost', { categoria: idCat, limit: num(cos.querySelector('[data-limit]').value) }, quePinto())
          .then(function (r) {
            App.tancaModal();
            App.brindis('Límit desat');
            Cau.oblida('finances.');
            aplica(r);
          })
          .catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
      });
    }

    // --------------------------------------------------------- mesos i estad

    function pintaMesos(d) {
      var max = 1;
      d.mesos.forEach(function (m) { max = Math.max(max, m.ingressos, m.despeses); });

      arrel.innerHTML = capcalera(true) +
        '<div class="pagina">' +
          '<div class="xifres">' +
            xifra('Acumulat', eurNum(d.acumulat, true), '€') +
            xifra('Mesos', d.mesos.length, '') +
            xifra('En positiu', d.mesos.filter(function (m) { return m.balanc >= 0; }).length, '') +
          '</div>' +
          '<section class="seccio">' +
            '<div class="seccio-cap"><h2>Mes a mes</h2>' +
              '<span class="menut tall-llegenda" aria-hidden="true">' +
                '<span><i></i>Entra</span><span><i data-surt></i>Surt</span></span></div>' +
            d.mesos.map(function (m) {
              return '<button class="mes-fila" data-mes="' + esc(m.mes) + '"' +
                ' aria-label="' + esc(nomMes(m.mes) + ': entra ' + eur(m.ingressos) + ', surt ' +
                  eur(m.despeses) + ', balanç ' + eur(m.balanc, true)) + '">' +
                '<span class="mes-nom">' + esc(m.mes.slice(5) + '/' + m.mes.slice(2, 4)) + '</span>' +
                '<span class="mes-barres" aria-hidden="true">' +
                  '<i data-mena="i" style="width:' + (m.ingressos / max * 100).toFixed(1) + '%"></i>' +
                  '<i data-mena="d" style="width:' + (m.despeses / max * 100).toFixed(1) + '%"></i>' +
                '</span>' +
                '<span class="mes-xifra num"' + (m.balanc < 0 ? ' data-avis' : '') + '>' +
                  eur(m.balanc, true) + '</span>' +
              '</button>';
            }).join('') +
            '<p class="menut seccio-nota">Toca un mes per obrir-lo.</p>' +
          '</section>' +
        '</div>';

      lligaCapcalera();
      arrel.querySelectorAll('[data-mes]').forEach(function (b) {
        b.addEventListener('click', function () {
          App.ves('finances', { mes: b.dataset.mes, periode: 'mes' });
        });
      });
    }

    function pintaEstad(d) {
      mes = d.mes;
      var maxMet = d.perMetode.length ? d.perMetode[0].total : 1;

      arrel.innerHTML = capcalera(d.mes === new Date().toISOString().slice(0, 7)) +
        '<div class="pagina">' +
          '<div class="xifres">' +
            xifra('Despeses', eurNum(d.despeses), '€') +
            xifra('Anterior', eurNum(d.despesesAnterior), '€') +
            xifra('Diferència', eurNum(d.diferencia, true), '€') +
          '</div>' +

          '<section class="seccio">' +
            '<div class="seccio-cap"><h2>Per categoria</h2><span class="menut">contra el mes passat</span></div>' +
            (d.perCategoria.length
              ? '<div class="cats">' + d.perCategoria.map(function (c) {
                  var puja = c.diferencia > 0;
                  return '<div class="cat-fila">' +
                    '<span class="cat-nom">' + esc(c.emoji ? c.emoji + ' ' : '') + esc(c.nom) + '</span>' +
                    '<span class="cat-xifra num">' + eur(c.total) +
                      (c.anterior ? '<small' + (puja ? ' data-avis' : '') + '>' +
                        (puja ? 'puja ' : 'baixa ') + eur(c.diferencia, true) + '</small>' : '') +
                    '</span>' +
                    '<span class="cat-via" aria-hidden="true"><i style="width:' + c.pct.toFixed(1) + '%"></i></span>' +
                  '</div>';
                }).join('') + '</div>'
              : '<p class="menut seccio-nota">Cap despesa aquest mes.</p>') +
          '</section>' +

          (d.perMetode.length
            ? '<section class="seccio">' +
                '<div class="seccio-cap"><h2>Com has pagat</h2></div>' +
                '<div class="cats">' +
                  d.perMetode.map(function (m) {
                    return '<div class="cat-fila">' +
                      '<span class="cat-nom">' + esc(m.metode) + '</span>' +
                      '<span class="cat-xifra num">' + eur(m.total) + '</span>' +
                      '<span class="cat-via" aria-hidden="true"><i style="width:' +
                        (m.total / maxMet * 100).toFixed(1) + '%"></i></span>' +
                    '</div>';
                  }).join('') +
                '</div>' +
              '</section>'
            : '') +

          (d.majors.length
            ? '<section class="seccio">' +
                '<div class="seccio-cap"><h2>Les cinc més grosses</h2></div>' +
                d.majors.map(function (m) {
                  return '<div class="fila">' +
                    '<span><b>' + esc(m.descripcio) + '</b>' +
                      '<span class="menut">' + esc(fmt.relativa(m.data)) + ' · ' + esc(m.categoriaNom) + '</span></span>' +
                    '<span class="import num">' + eur(m.import) + '</span>' +
                  '</div>';
                }).join('') +
              '</section>'
            : '') +
        '</div>';

      lligaCapcalera();
    }

    // --------------------------------------------------------------- patrimoni

    /* «De quan» és tan important com «quant»: un valor de Trade Republic de fa
       dos mesos no és el teu capital, és el que era. Per això cada actiu diu
       quants dies fa del seu últim valor, i els que fa temps que no toques es
       marquen. El compte del banc s'actualitza sol; la resta només ho saps tu. */
    function pintaPatrimoni(d) {
      var actius = d.actius || [];

      arrel.innerHTML = capcalera(false) +
        '<div class="pagina">' +
          '<section class="balanc">' +
            '<p class="gravat">Total</p>' +
            '<p class="balanc-v"><span class="n num">' + eurNum(d.total) + '</span><span class="u">€</span></p>' +
            '<p class="balanc-frase menut">Suma dels últims valors coneguts de cada actiu.</p>' +
          '</section>' +
          '<button class="btn btn-secundari btn-ple accio-gran" data-nou-actiu>' +
            ic('mes') + 'Afegeix un actiu</button>' +

          '<section class="seccio">' +
            '<div class="seccio-cap"><h2>Actius</h2><span class="menut">de quan és cada valor</span></div>' +
            (actius.length
              ? actius.map(function (a) {
                  var vell = a.dies === null || a.dies >= 30;
                  return '<button class="fila act-fila" data-actiu="' + esc(a.id) + '"' +
                    ' data-nom="' + esc(a.nom) + '" data-auto="' + (a.automatic ? '1' : '0') + '">' +
                    '<span>' +
                      '<b>' + esc(a.nom) + '</b>' +
                      '<span class="menut"' + (vell ? ' data-vell="1"' : '') + '>' +
                        (a.automatic ? 'del banc · ' : '') +
                        /* `null` estava cobert i `undefined` no, i la
                           diferència la veia l usuari: «fa undefined dies» a
                           cada actiu quan la resposta no portava el camp. */
                        (a.data === null || a.dies === null || a.dies === undefined
                          ? 'encara sense valor'
                          : a.dies === 0 ? 'avui'
                          : 'fa ' + a.dies + (a.dies === 1 ? ' dia' : ' dies')) +
                      '</span>' +
                    '</span>' +
                    (a.historic.length > 1 ? espurna(a.historic) : '<span aria-hidden="true"></span>') +
                    '<span class="import num">' +
                      (a.valor === null ? '—' : eur(a.valor)) + '</span>' +
                  '</button>';
                }).join('')
              : '<p class="menut seccio-nota">Encara no hi tens res. El compte del banc hi apareixerà sol ' +
                'quan sincronitzi.</p>') +
          '</section>' +
        '</div>';

      lligaCapcalera();
      arrel.querySelector('[data-nou-actiu]').addEventListener('click', function () { obreActiu(null); });
      arrel.querySelectorAll('[data-actiu]').forEach(function (b) {
        b.addEventListener('click', function () {
          var a = null;
          for (var i = 0; i < actius.length; i++) if (actius[i].id === b.dataset.actiu) a = actius[i];
          if (a) obreActiu(a);
        });
      });
    }

    /** Una línia amb la forma dels últims valors. Diu si puja o baixa d'un cop d'ull. */
    function espurna(hist) {
      var vals = hist.map(function (h) { return h.valor; });
      var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
      var rang = max - min || 1;
      var punts = vals.map(function (v, i) {
        return (i / (vals.length - 1) * 100).toFixed(1) + ',' +
               (26 - (v - min) / rang * 22).toFixed(1);
      }).join(' ');
      var puja = vals[vals.length - 1] >= vals[0];
      return '<svg class="espurna" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true">' +
             '<polyline points="' + punts + '" data-puja="' + (puja ? '1' : '0') + '"/></svg>';
    }

    function obreActiu(a) {
      var editant = !!a;
      var auto = editant && a.automatic;

      var cos = App.modal(editant ? a.nom : 'Nou actiu',
        '<div class="form-ajustos form-apunt">' +
          (editant
            ? '<label><span class="marge">Quant val ara</span>' +
                '<input data-valor data-primer inputmode="decimal" class="num camp-import" placeholder="0,00" value="' +
                  (a.valor === null ? '' : String(a.valor).replace('.', ',')) + '" autocomplete="off"></label>' +
              '<button class="btn btn-primari" data-anota>Anota el valor d\'avui</button>' +
              (auto
                ? '<p class="menut">Aquest el porta el banc i ' +
                  's\'actualitza sol cada matinada. Pots canviar-li el nom, però no el treguis: ' +
                  'el banc en crearia un de nou al costat.</p>'
                : '') +
              '<hr>'
            : '') +
          '<label><span class="marge">Nom</span>' +
            '<input data-nom autocomplete="off" placeholder="p. ex. Trade Republic" value="' +
              (editant ? esc(a.nom) : '') + '"></label>' +
          '<label><span class="marge">Tipus</span>' +
            '<input data-tipus autocomplete="off" placeholder="estalvi, borsa, cripto…" value="' +
              (editant ? esc(a.tipus || '') : '') + '"></label>' +
          '<button class="btn btn-secundari" data-desa-actiu>' + (editant ? 'Desa el nom' : 'Crea') + '</button>' +
          (editant && !auto
            ? '<button class="btn btn-secundari" data-treu-actiu>Arxiva\'l</button>' : '') +
        '</div>');

      var ba = cos.querySelector('[data-anota]');
      if (ba) ba.addEventListener('click', function () {
        var v = cos.querySelector('[data-valor]').value;
        if (!String(v).trim()) { App.brindis('Posa-hi un valor', 'error'); return; }
        ba.disabled = true;
        escriu('finances', 'anotaValor', { id: a.id, valor: num(v) }, quePinto())
          .then(function (r) {
            App.tancaModal(); App.brindis('Valor anotat');
            Cau.oblida('finances.'); aplica(r);
          })
          .catch(function (err) { ba.disabled = false; App.brindis(err.message, 'error'); });
      });

      cos.querySelector('[data-desa-actiu]').addEventListener('click', function () {
        var nom = cos.querySelector('[data-nom]').value.trim();
        if (!nom) { App.brindis('Posa-hi un nom', 'error'); return; }
        var b = this;
        b.disabled = true;
        escriu('finances', 'desaActiu', {
          id: editant ? a.id : null, nom: nom,
          tipus: cos.querySelector('[data-tipus]').value.trim()
        }, quePinto()).then(function (r) {
          App.tancaModal(); App.brindis(editant ? 'Desat' : 'Creat');
          Cau.oblida('finances.'); aplica(r);
        }).catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
      });

      var bt = cos.querySelector('[data-treu-actiu]');
      if (bt) bt.addEventListener('click', function () {
        App.confirma('Arxivar «' + esc(a.nom) + '»?',
          '<p class="menut">Els valors que hi tens anotats es queden. Deixa de comptar ' +
            'al total del patrimoni.</p>',
          'Sí, arxiva-l\'ho',
          function (b) {
            escriu('finances', 'arxivaActiu', { id: a.id }, quePinto())
              .then(function (r) {
                App.tancaModal(); App.brindis('Tret');
                Cau.oblida('finances.'); aplica(r);
              })
              .catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
          });
      });
    }

    // -------------------------------------------------------------- recurrents

    /* El que passa cada mes sense que hi facis res: el lloguer, les
       subscripcions, la quota del gimnàs. Es creen sols de matinada el dia que
       toca, i el que veus aquí és la LLISTA del que passarà, no el que ja ha
       passat: això últim ja surt als moviments del mes com qualsevol altre. */
    function pintaRecurrents(d) {
      var llista = d.llista || [];
      var mesAra = new Date().toISOString().slice(0, 7);
      var v = d.vigilancia || { compromes: 0, esperat: 0, falten: [], canviats: [],
                                perRecurrent: [] };
      var estats = {};
      (v.perRecurrent || []).forEach(function (x) { estats[x.id] = x; });

      arrel.innerHTML = capcalera(false) +
        '<div class="pagina">' +
          /* EL TERRA DEL MES, i és la xifra que abans no sortia enlloc.
             «He gastat 780 €» i «tinc 862 € compromesos passi el que passi»
             són dues coses molt diferents, i la segona és la que et diu quant
             et queda de debò per decidir. */
          '<div class="xifres">' +
            xifra('Compromès', eurNum(v.compromes), '€') +
            xifra('Entren', eurNum(v.esperat), '€') +
            xifra('Actius', llista.filter(function (r) { return r.actiu; }).length, '') +
          '</div>' +
          '<p class="menut seccio-nota">El que surt cada mes sense fer-hi res. Els porta el banc; ' +
            'aquí el que es fa és vigilar que arribin i que no pugin de preu.</p>' +

          alarmes(v) +

          '<button class="btn btn-primari btn-ple accio-gran" data-tria-rec>' +
            ic('mes') + 'Afegeix-ne un</button>' +

          propostes(d) +

          '<section class="seccio">' +
            '<div class="seccio-cap"><h2>Els rebuts fixos</h2><span class="menut">dia del mes</span></div>' +
            (llista.length
              ? llista.map(function (r) {
                  /* L'ESTAT D'AQUEST MES, dit amb paraules i no amb un color.
                     «Pendent» volia dir «encara no l'he escrit jo», que amb el
                     banc connectat no vol dir res. Ara diu si ha arribat, si
                     encara no toca o si el s'espera i no hi és. */
                  var e = estats[r.id] || { estat: 'esperant' };
                  var diu = !r.actiu ? 'aturat'
                          : e.estat === 'arribat' ? 'ha arribat el ' + Number(String(e.data).slice(8, 10))
                          : e.estat === 'canviat' ? 'ha arribat, però per ' + eurNum(e.import) + ' €'
                          : e.estat === 'falta' ? 'no ha arribat'
                          : 'encara no toca';
                  return '<button class="fila rec-fila" data-rec="' + esc(r.id) + '"' +
                    (r.actiu ? '' : ' data-apagat="1"') +
                    ' data-estat="' + esc(e.estat) + '">' +
                    '<span class="rec-dia">Dia<b>' + r.dia + '</b></span>' +
                    '<span>' +
                      '<b>' + esc(r.descripcio) + '</b>' +
                      '<span class="menut">' + esc((r.emoji ? r.emoji + ' ' : '') + r.categoriaNom) +
                        ' · <span class="estat-rec">' + esc(diu) + '</span>' +
                      '</span>' +
                    '</span>' +
                    '<span class="import num"' + (r.tipus === 'i' ? ' data-entra' : '') + '>' +
                      (r.tipus === 'i' ? '+' : '−') + eur(r.import) + '</span>' +
                  '</button>';
                }).join('')
              : '<p class="menut seccio-nota">Encara no en tens cap.</p>') +
          '</section>' +
        '</div>';
      lligaCapcalera();
      arrel.querySelector('[data-tria-rec]').addEventListener('click', function () {
        obreTriador(d.triables || []);
      });
      arrel.querySelectorAll('[data-rec]').forEach(function (b) {
        b.addEventListener('click', function () {
          var r = null;
          for (var i = 0; i < llista.length; i++) if (llista[i].id === b.dataset.rec) r = llista[i];
          if (r) obreRecurrent(r);
        });
      });

      /* «Ha pujat» sense poder-hi fer res és una queixa. El botó posa el preu
         nou a l'expectativa, i a partir d'aquí el que vigila és el nou. */
      arrel.querySelectorAll('[data-posa]').forEach(function (b) {
        b.addEventListener('click', function () {
          var r = null;
          for (var i = 0; i < llista.length; i++) if (llista[i].id === b.dataset.posa) r = llista[i];
          if (!r) return;
          b.disabled = true; b.textContent = 'Desant…';
          escriu('finances', 'desaRecurrent', {
            id: r.id, clau: r.clau, contrapart: r.contrapart, variable: r.variable,
            tipus: r.tipus, 'import': Number(b.dataset.nou),
            descripcio: r.descripcio, categoria: r.categoria, metode: r.metode,
            dia: r.dia, actiu: true
          }, quePinto()).then(function (p) {
            App.brindis('Actualitzat');
            Cau.oblida('finances.'); aplica(p);
          }).catch(function (err) {
            b.disabled = false; App.brindis(err.message, 'error');
          });
        });
      });

      var props = d.propostes || [];
      arrel.querySelectorAll('[data-prop]').forEach(function (b) {
        b.addEventListener('click', function () {
          var g = props.filter(function (x) { return x.clau === b.dataset.prop; })[0];
          if (g) obreRecurrent(deGrup(g));
        });
      });
      arrel.querySelectorAll('[data-fora]').forEach(function (b) {
        b.addEventListener('click', function (ev) {
          ev.stopPropagation();
          b.disabled = true;
          escriu('finances', 'descarta', { clau: b.dataset.fora }, quePinto())
            .then(function (p) {
              App.brindis('No te\'l tornaré a proposar');
              Cau.oblida('finances.'); aplica(p);
            })
            .catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
        });
      });
    }

    /* ═══════════════════════════════════════════════════════════════════
       LES DUES COSES QUE UN MOVIMENT NO POT DIR

       Els moviments són el que ha passat. Això és el que NO ha passat —un
       rebut que s'espera i no hi és— i el que ha passat DIFERENT —un que ha
       arribat per un altre import. Cap de les dues es veu mirant la llista
       del mes: la primera perquè no hi és, i la segona perquè hi és com una
       línia més entre trenta.

       Van a dalt de tot i amb el fil encès: si hi són, són el motiu pel qual
       val la pena que aquesta pantalla existeixi.
       ═══════════════════════════════════════════════════════════════════ */
    function alarmes(v) {
      var falten = v.falten || [], canviats = v.canviats || [];
      if (!falten.length && !canviats.length) return '';

      return '<section class="vigila" aria-label="El que cal mirar">' +
          falten.map(function (f) {
            return '<div class="vigila-fila" data-mena="falta">' + ic('avis') +
              '<span><b>' + esc(f.descripcio) + (f.tipus === 'i' ? ' no ha entrat' : ' no ha arribat') +
                '</b><span class="menut">' + esc('Feia ' + eurNum(f.import) + ' € el dia ' + f.dia +
                ' i en portem ' + f.dies + ' de retard.') + '</span></span>' +
            '</div>';
          }).join('') +
          canviats.map(function (c) {
            var amunt = c.diferencia > 0;
            return '<div class="vigila-fila" data-mena="' + (amunt ? 'puja' : 'baixa') + '">' +
              ic(amunt ? 'avis' : 'punxo') +
              '<span><b>' + esc(c.descripcio) + (amunt ? ' ha pujat' : ' ha baixat') + '</b>' +
              '<span class="menut">' + esc('Pagaves ' + eurNum(c.abans) + ' € i aquest mes són ' +
                eurNum(c.ara) + ' € (' + (amunt ? '+' : '') + c.percentatge + ' %).') + '</span></span>' +
              '<button class="btn btn-secundari btn-menut" data-posa="' + esc(c.id) +
                '" data-nou="' + c.ara + '">Posa-hi ' + eurNum(c.ara) + '</button>' +
            '</div>';
          }).join('') +
      '</section>';
    }

    /* Un grup de moviments, vestit de recurrent perquè el formulari el pugui
       obrir. Sense `id`: no és editar-ne cap, és crear-ne un que ja ve escrit. */
    function deGrup(g) {
      return { tipus: g.tipus, import: g.import, descripcio: g.descripcio,
               categoria: g.categoria, metode: g.metode, dia: g.dia,
               actiu: true, clau: g.clau, contrapart: g.contrapart || '',
               variable: !!g.variable };
    }

    /* ═══════════════════════════════════════════════════════════════════
       EL QUE JEFE HA VIST ALS MOVIMENTS QUE JA TENS

       No és una llista del que es repeteix: això seria el súper. És el que es
       repeteix AMB EL MATEIX IMPORT i un sol cop al mes, que és el que fa que
       una cosa sigui un rebut i no una compra. Cada proposta porta per què
       s'ha proposat —quants mesos i quant balla— perquè decidir no impliqui
       fiar-se'n.
       ═══════════════════════════════════════════════════════════════════ */
    function propostes(d) {
      var p = d.propostes || [];
      if (!p.length) return '';
      return '<section class="seccio">' +
        '<div class="seccio-cap"><h2>Ho he vist als teus moviments</h2></div>' +
        p.map(function (g) {
          return '<div class="prop-fila">' +
            '<button class="fila" data-prop="' + esc(g.clau) + '">' +
              '<span>' +
                '<b>' + esc(g.descripcio) + '</b>' +
                '<span class="menut">' + esc(g.mesos + ' de ' + g.mesosMirats + ' mesos · ' +
                  (g.variable ? 'de ' + eurNum(g.minim) + ' a ' + eurNum(g.maxim) + ' €, va variant'
                   : g.minim === g.maxim ? 'sempre ' + eurNum(g.import) + ' €'
                   : eurNum(g.minim) + '–' + eurNum(g.maxim) + ' €') +
                  ' · dia ' + g.dia) + '</span>' +
              '</span>' +
              '<span class="import num"' + (g.tipus === 'i' ? ' data-entra' : '') + '>' +
                (g.tipus === 'i' ? '+' : '−') + eur(g.import) + '</span>' +
            '</button>' +
            '<button class="prop-no" data-fora="' + esc(g.clau) + '" ' +
              'aria-label="No proposis més ' + esc(g.descripcio) + '">' + ic('tancar') + '</button>' +
          '</div>';
        }).join('') +
        '<p class="menut seccio-nota">Toca\'n un per confirmar-lo. La creu vol ' +
          'dir que no, i llavors no te\'l torno a proposar.</p>' +
      '</section>';
    }

    /* TRIAR-LO D'UNA LLISTA EN COMPTES D'ESCRIURE'L.
       És el que va demanar: «que els pugués seleccionar de la llista inicial
       on em surten tots actualitzats». Aquí hi són tots els comerços dels sis
       últims mesos, amb el que se sap de cadascun; els que no compleixen els
       filtres també hi són, perquè hi ha rebuts que només ell sap que ho són. */
    function obreTriador(tots) {
      var cos = App.modal('D\'on ve el rebut?',
        '<div class="form-ajustos">' +
          (tots.length
            ? '<p class="menut">Dels teus moviments dels últims mesos. Toca el que sigui un ' +
                'rebut fix i t\'ompliré el formulari.</p>' +
              '<div class="tria-mov">' + tots.map(function (g) {
                return '<button class="fila" data-tria="' + esc(g.clau) + '">' +
                  '<span>' +
                    '<b>' + esc(g.descripcio) + '</b>' +
                    '<span class="menut">' + esc(g.mesos + ' de ' + g.mesosMirats + ' mesos · ' +
                      (g.minim === g.maxim ? 'sempre ' + eurNum(g.import)
                                           : 'de ' + eurNum(g.minim) + ' a ' + eurNum(g.maxim)) + ' €') +
                    '</span>' +
                  '</span>' +
                  '<span class="import num"' + (g.tipus === 'i' ? ' data-entra' : '') + '>' +
                    (g.tipus === 'i' ? '+' : '−') + eur(g.import) + '</span>' +
                '</button>';
              }).join('') + '</div>'
            : '<p class="menut">Encara no hi ha prou moviments per triar-ne cap.</p>') +
          '<button class="btn btn-secundari btn-ple" data-a-ma>' +
            'Escriu-lo a mà</button>' +
        '</div>');

      cos.querySelector('[data-a-ma]').addEventListener('click', function () {
        App.tancaModal();
        setTimeout(function () { obreRecurrent(null); }, 120);
      });
      cos.querySelectorAll('[data-tria]').forEach(function (b) {
        b.addEventListener('click', function () {
          var g = tots.filter(function (x) { return x.clau === b.dataset.tria; })[0];
          if (!g) return;
          App.tancaModal();
          setTimeout(function () { obreRecurrent(deGrup(g)); }, 120);
        });
      });
    }

    /* S'OBRE BUIT, PLE O A MITGES.
       Buit quan l'escrius tu. Ple quan edites un que ja existeix. I a mitges
       —amb tot omplert però sense identificador— quan ve d'una proposta o
       d'un moviment que has triat de la llista: llavors no és editar-ne cap,
       és crear-ne un que ja ve escrit. Distingir-ho per `r.id` i no per si
       hi ha `r` és el que ho fa possible. */
    function obreRecurrent(r) {
      var editant = !!(r && r.id);
      var tipus = r ? r.tipus : 'd';

      var cos = App.modal(editant ? 'Edita el recurrent'
                        : r ? 'Confirma el rebut fix' : 'Nou recurrent',
        '<div class="form-ajustos form-apunt">' +
          '<div class="tipus-tria" role="group">' +
            '<button data-tipus="d"' + (tipus === 'd' ? ' aria-pressed="true"' : '') + '>Surt</button>' +
            '<button data-tipus="i"' + (tipus === 'i' ? ' aria-pressed="true"' : '') + '>Entra</button>' +
          '</div>' +
          '<label><span class="marge">Import</span>' +
            '<input data-c="import" data-primer inputmode="decimal" class="num camp-import" placeholder="0,00" value="' +
              (r ? String(r.import).replace('.', ',') : '') + '" autocomplete="off"></label>' +
          '<label><span class="marge">Què és</span>' +
            '<input data-c="descripcio" autocomplete="off" placeholder="p. ex. Lloguer" value="' +
              (r ? esc(r.descripcio) : '') + '"></label>' +
          '<label><span class="marge">Categoria</span><select data-c="categoria"></select></label>' +
          '<label><span class="marge">Com es paga</span>' +
            '<select data-c="metode">' +
              ['domic', 'targeta', 'transf', 'efectiu', 'online'].map(function (x) {
                return '<option value="' + x + '"' +
                       (r && r.metode === x ? ' selected' : '') + '>' + x + '</option>';
              }).join('') + '</select></label>' +
          '<label><span class="marge">Quin dia del mes</span>' +
            '<input data-c="dia" inputmode="numeric" class="num" value="' +
              (r ? r.dia : 1) + '" autocomplete="off"></label>' +
          /* Fins al 28 i no fins al 31: així cau tots els mesos, també el
             febrer. Un rebut del dia 31 no existiria mig any. */
          '<p class="menut">Del 1 al 28. Més enllà no existeix tots els mesos.</p>' +
          (editant
            ? '<label class="cat-exclou"><input type="checkbox" data-c="actiu"' +
              (r.actiu ? ' checked' : '') + '><span>Actiu</span></label>' : '') +
          '<button class="btn btn-primari" data-desa-rec>' + (editant ? 'Desa' : 'Crea') + '</button>' +
          (editant ? '<button class="btn btn-secundari" data-treu-rec>Arxiva\'l</button>' : '') +
        '</div>');

      var camps = {};
      cos.querySelectorAll('[data-c]').forEach(function (i) { camps[i.dataset.c] = i; });

      function pintaCategories() {
        camps.categoria.innerHTML = cats.filter(function (c) { return c.mena === tipus; })
          .map(function (c) {
            return '<option value="' + esc(c.id) + '"' +
                   (r && r.categoria === c.id ? ' selected' : '') + '>' +
                   esc((c.emoji ? c.emoji + ' ' : '') + c.nom) + '</option>';
          }).join('');
      }
      pintaCategories();

      cos.querySelectorAll('[data-tipus]').forEach(function (b) {
        b.addEventListener('click', function () {
          tipus = b.dataset.tipus;
          cos.querySelectorAll('[data-tipus]').forEach(function (x) {
            x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
          });
          pintaCategories();
        });
      });

      cos.querySelector('[data-desa-rec]').addEventListener('click', function () {
        var imp = num(camps['import'].value);
        if (imp <= 0) { App.brindis('Posa-hi un import', 'error'); camps['import'].focus(); return; }
        /* I UN SOSTRE, que no n hi havia cap: un dit de mes al teclat numeric
           apuntava 999.999.999 EUR i les sumes del mes deixaven de voler dir res.
           El limit es absurdament alt a posta —cap moviment teu s hi acostara—
           i nomes serveix per aturar el que es clarament una relliscada. */
        if (imp > 1000000) {
          App.brindis('Aquest import és massa gran. Mira la xifra.', 'error');
          camps['import'].focus(); return;
        }
        if (!camps.descripcio.value.trim()) {
          App.brindis('Digues què és', 'error'); camps.descripcio.focus(); return;
        }
        var b = this;
        b.disabled = true;
        escriu('finances', 'desaRecurrent', {
          id: editant ? r.id : null,
          /* Si ve d'un moviment de debò, es passa qui el cobra. És el que
             després evita que el rebut es compti dues vegades: una perquè
             l'has apuntat i una altra perquè el banc l'ha portat. */
          clau: r && r.clau ? r.clau : null,
          contrapart: r && r.contrapart ? r.contrapart : null,
          variable: r ? !!r.variable : false,
          tipus: tipus, 'import': imp,
          descripcio: camps.descripcio.value.trim(),
          categoria: camps.categoria.value,
          metode: camps.metode.value,
          dia: num(camps.dia.value),
          actiu: camps.actiu ? camps.actiu.checked : true
        }, quePinto()).then(function (r) {
          App.tancaModal(); App.brindis(editant ? 'Desat' : 'Creat');
          Cau.oblida('finances.'); aplica(r);
        }).catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
      });

      var bt = cos.querySelector('[data-treu-rec]');
      if (bt) bt.addEventListener('click', function () {
        App.confirma('Arxivar aquest rebut fix?',
          '<p>' + esc(r.nom || r.descripcio || '') + '</p>' +
          '<p class="menut">Deixa de vigilar-lo: ja no dirà res si un mes no arriba o si puja.</p>',
          'Sí, arxiva-l\'ho',
          function (b) {
            escriu('finances', 'arxivaRecurrent', { id: r.id }, quePinto())
              .then(function (p) {
                App.tancaModal(); App.brindis('Tret');
                Cau.oblida('finances.'); aplica(p);
              })
              .catch(function (err) { b.disabled = false; App.brindis(err.message, 'error'); });
          });
      });
    }

    // ------------------------------------------------------ safata de revisió

    /* AGRUPADA PER COMERÇ, i això és tota la idea.
       Dotze compres a l'estanc són una sola decisió, no dotze. El que fa
       costa amunt revisar no és el nombre de moviments: és el nombre de
       vegades que t'han de preguntar. Un cop decidit, s'apren i no torna. */
    function pintaRevisar(d) {
      var cats = d.categories || [];

      /* AMB NOM, QUE N'HI HA UN PER FILA.
         Sense aria-label els desplegables d'aquesta pantalla s'anuncien tots
         igual —«Tria…, llista desplegable»— i és el control principal de
         Revisar: qui l'escolta no sap de quin comerç és el que té a sota.
         El nom de la fila ja el teníem aquí; només calia passar-lo. */
      function triador(valor, dades, deQui) {
        return '<select ' + dades +
          (deQui ? ' aria-label="Categoria de ' + esc(deQui) + '"' : '') + '>' +
          '<option value="">Tria…</option>' +
          cats.filter(function (c) { return c.mena === valor; }).map(function (c) {
            return '<option value="' + esc(c.id) + '">' +
                   esc((c.emoji ? c.emoji + ' ' : '') + c.nom) + '</option>';
          }).join('') +
        '</select>';
      }

      arrel.innerHTML = capcalera(false) +
        '<div class="pagina">' +
            '<div class="xifres">' +
              xifra('Comerços', d.comercos.length, '') +
              xifra('Solts', d.solts.length, '') +
              xifra('Moviments', d.totalMoviments, '') +
            '</div>' +
            '<p class="menut seccio-nota">Cada comerç és una sola decisió: es queda apresa i ' +
              'no te\'n tornaré a preguntar mai més.</p>' +

          '<section class="seccio">' +
            '<div class="seccio-cap"><h2>Comerços</h2>' +
              '<span class="menut">' + d.comercos.length + ' per decidir</span></div>' +
            (d.comercos.length
              ? '<div class="revisar">' +
                  d.comercos.map(function (g) {
                    return '<div class="rev-fila" data-clau="' + esc(g.clau) + '">' +
                      '<div class="rev-cap">' +
                        '<b>' + esc(g.mostra) + '</b>' +
                        '<span class="num menut">' + g.moviments + ' · ' + eur(g.total) + '</span>' +
                      '</div>' +
                      '<div class="menut">' + esc(fmt.relativa(g.primera)) +
                        (g.primera !== g.ultima ? ' → ' + esc(fmt.relativa(g.ultima)) : '') +
                        ' · ' + (g.tipus === 'i' ? 'ingrés' : 'despesa') + '</div>' +
                      triador(g.tipus, 'data-tria-grup', g.mostra) +
                    '</div>';
                  }).join('') +
                '</div>'
              : '<p class="menut seccio-nota">Cap comerç pendent.</p>') +
          '</section>' +

            (d.solts.length
              ? '<section class="seccio">' +
                '<div class="seccio-cap"><h2>D\'un en un</h2></div>' +
                '<p class="menut seccio-nota">Aquests no porten el nom del comerç: el banc hi ha ' +
                  'posat una etiqueta genèrica. Cada un és una compra diferent, i per ' +
                  'això no s\'aprenen mai.</p>' +
                '<div class="revisar">' +
                  d.solts.map(function (m) {
                    return '<div class="rev-fila" data-mov="' + esc(m.id) + '">' +
                      '<div class="rev-cap">' +
                        '<b>' + esc(m.descripcio) + '</b>' +
                        '<span class="num menut">' + eur(m.import) + '</span>' +
                      '</div>' +
                      '<div class="menut">' + esc(fmt.relativa(m.data)) + ' · ' +
                        (m.tipus === 'i' ? 'ingrés' : 'despesa') + '</div>' +
                      triador(m.tipus, 'data-tria-mov', m.descripcio) +
                    '</div>';
                  }).join('') +
                '</div>' +
              '</section>'
              : '') +
        '</div>';

      lligaCapcalera();

      /* En triar, s'aplica i la fila se'n va. Sense botó de desar: afegir un
         segon toc a cada decisió és tornar a posar la fricció que treiem. */
      arrel.querySelectorAll('[data-tria-grup]').forEach(function (sel) {
        sel.addEventListener('change', function () {
          if (!sel.value) return;
          var fila = sel.closest('.rev-fila');
          fila.dataset.fent = '1'; sel.disabled = true;
          crida('finances', 'decideix', { clau: fila.dataset.clau, categoria: sel.value })
            .then(function (r) {
              fila.dataset.fet = '1';
              Cau.oblida('finances.');
              App.brindis(r.tocats + (r.tocats === 1 ? ' moviment classificat' : ' moviments classificats'));
              setTimeout(function () { fila.remove(); comprovaBuit(); }, 260);
            })
            .catch(function (err) {
              fila.dataset.fent = '0'; sel.disabled = false;
              App.brindis(err.message, 'error');
            });
        });
      });

      arrel.querySelectorAll('[data-tria-mov]').forEach(function (sel) {
        sel.addEventListener('change', function () {
          if (!sel.value) return;
          var fila = sel.closest('.rev-fila');
          fila.dataset.fent = '1'; sel.disabled = true;
          crida('finances', 'decideixUn', { id: fila.dataset.mov, categoria: sel.value })
            .then(function () {
              fila.dataset.fet = '1';
              Cau.oblida('finances.');
              setTimeout(function () { fila.remove(); comprovaBuit(); }, 260);
            })
            .catch(function (err) {
              fila.dataset.fent = '0'; sel.disabled = false;
              App.brindis(err.message, 'error');
            });
        });
      });

      function comprovaBuit() {
        if (!arrel.querySelector('.rev-fila')) {
          App.brindis('Safata buida');
          App.ves('finances', { mes: mes, periode: 'mes' });
        }
      }
    }

    // -------------------------------------------------------------- accions

    function lligaCapcalera() {
      arrel.querySelectorAll('[data-salt]').forEach(function (b) {
        b.addEventListener('click', function () {
          var nou = mouMes(mes, Number(b.dataset.salt));
          if (nou > new Date().toISOString().slice(0, 7)) return;
          App.ves('finances', { mes: nou, periode: periode });
        });
      });

      var bp = arrel.querySelector('[data-obre-periode]');
      if (bp) bp.addEventListener('click', obrePeriode);

      arrel.querySelectorAll('[data-apunta]').forEach(function (b) {
        b.addEventListener('click', function () { obreApunt(null); });
      });

      var brev = arrel.querySelector('[data-revisar]');
      if (brev) brev.addEventListener('click', function () {
        App.ves('finances', { mes: mes, periode: 'revisar' });
      });

      var baj = arrel.querySelector('[data-ajustos]');
      if (baj) baj.addEventListener('click', obreAjustos);
    }

    /**
     * Portar-hi l'històric de l'app antiga. En dos temps: un assaig que no
     * escriu res i diu què faria, i només després l'escriptura. Amb dades de
     * diners, ensenyar el resultat abans de tocar-les no és una cortesia.
     */
    function obreAjustos() {
      var cos = App.modal('Categories i importació',
        '<div class="form-ajustos">' +
          '<p class="marge">Categories</p>' +
          '<div id="fin-cats" class="cats-gest"></div>' +

          '<div class="cat-nova">' +
            '<div class="tipus-tria" role="group">' +
              '<button data-nova-mena="d" aria-pressed="true">Despesa</button>' +
              '<button data-nova-mena="i">Ingrés</button>' +
            '</div>' +
            '<div class="cat-nova-fila">' +
              '<input data-nova-emoji placeholder="🛒" maxlength="4" class="camp-emoji" autocomplete="off" ' +
                'aria-label="Emoji de la categoria">' +
              '<input data-nova-nom placeholder="Nom de la categoria" autocomplete="off" ' +
                'aria-label="Nom de la categoria">' +
            '</div>' +
            '<label class="cat-exclou">' +
              '<input type="checkbox" data-nova-exclou>' +
              '<span>Fora dels comptes (com els traspassos)</span>' +
            '</label>' +
            '<button class="btn btn-secundari" data-crea-cat>Crea la categoria</button>' +
          '</div>' +

          '<hr>' +
          '<p class="marge">Portar-hi les dades de l\'app antiga</p>' +
          '<p class="menut">Tria el fitxer que exportes des de finances. Primer et diré què hi ' +
            'trobo i què faria; no s\'escriu res fins que ho confirmis. No esborra ni sobreescriu ' +
            'mai, i es pot repetir sense duplicar.</p>' +
          '<input type="file" accept="application/json,.json" data-fitxer>' +
          '<div id="fin-import"></div>' +
        '</div>');

      // ---- categories
      var menaNova = 'd';
      var llista = cos.querySelector('#fin-cats');

      function pintaCats() {
        llista.innerHTML = ['d', 'i'].map(function (mena) {
          var d_ = cats.filter(function (c) { return c.mena === mena; });
          if (!d_.length) return '';
          return '<p class="menut cat-mena">' + (mena === 'd' ? 'Despeses' : 'Ingressos') + '</p>' +
            d_.map(function (c) {
              return '<div class="cat-gest">' +
                '<span class="cat-gest-nom">' + esc((c.emoji ? c.emoji + ' ' : '') + c.nom) +
                  (c.exclou ? ' <span class="menut">· fora dels comptes</span>' : '') + '</span>' +
                '<button class="btn btn-fantasma btn-icona" data-treu-cat="' + esc(c.id) +
                  '" aria-label="Treu ' + esc(c.nom) + '">' + ic('tancar', 'ic-p') + '</button>' +
              '</div>';
            }).join('');
        }).join('');

        llista.querySelectorAll('[data-treu-cat]').forEach(function (b) {
          b.addEventListener('click', function () {
            App.confirma('Arxivar aquesta categoria?',
              '<p class="menut">Els moviments que ja hi són no es perden. Deixa de sortir ' +
                'a la llista per triar-la de nou.</p>',
              'Sí, arxiva-la',
              function () {
                crida('finances', 'arxivaCategoria', { id: b.dataset.treuCat })
                  .then(function () { App.tancaModal(); refrescaCats(); })
                  .catch(function (err) { App.tancaModal(); App.brindis(err.message, 'error'); });
              });
          });
        });
      }

      function refrescaCats() {
        Cau.oblida('finances.');
        return crida('finances', 'categories', {}).then(function (l) {
          cats = l; pintaCats();
        });
      }
      pintaCats();

      cos.querySelectorAll('[data-nova-mena]').forEach(function (b) {
        b.addEventListener('click', function () {
          menaNova = b.dataset.novaMena;
          cos.querySelectorAll('[data-nova-mena]').forEach(function (x) {
            x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
          });
        });
      });

      cos.querySelector('[data-crea-cat]').addEventListener('click', function () {
        var nom = cos.querySelector('[data-nova-nom]');
        var emoji = cos.querySelector('[data-nova-emoji]');
        var exclou = cos.querySelector('[data-nova-exclou]');
        if (!nom.value.trim()) { App.brindis('Posa-hi un nom', 'error'); nom.focus(); return; }

        var b = this;
        b.disabled = true;
        crida('finances', 'creaCategoria', {
          nom: nom.value.trim(), emoji: emoji.value.trim(),
          mena: menaNova, exclou: exclou.checked
        }).then(function () {
          nom.value = ''; emoji.value = ''; exclou.checked = false;
          b.disabled = false;
