<script>
/* =========================================================================
   JEFE — EL CALAIX DE PREGUNTAR
   =========================================================================

   La IA, amagada. Va ser la pantalla d'arrencada —una esfera i una caixa per
   parlar-hi— i en Pol la va treure després de fer-la servir: per FER una cosa
   és més ràpid fer-la que demanar-la. Però per PREGUNTAR encara serveix, i
   això és el que en queda: un botó a la cantonada, i un calaix quan el
   necessites.

   QUÈ CANVIA RESPECTE D'ABANS, I PER QUÈ
     · No és la porta de l'app. S'obre des d'on siguis i es tanca; el que hi
       ha a sota no es mou.
     · No hi ha micròfon. Va durar poc: transcriure costava la volta sencera
       i escriure quatre paraules és més ràpid que dir-les i esperar.
     · No hi ha telemetria a la vista. Els segons i els tokens interessaven a
       qui la construïa, no a qui la fa servir.

   EL QUE NO CANVIA, I NO HA DE CANVIAR MAI: res del que escrigui passa sense
   que ell ho confirmi. Les eines marcades per escriure no s'executen —tornen
   una PROPOSTA amb un botó—, i això és el que fa que se li pugui deixar tocar
   el full de càlcul. Vegeu 55_Assistent.gs.
   ========================================================================= */

var Xat = (function () {

  var missatges = [];          // { rol, text, propostes }
  var idConversa = null;
  var ocupat = false;
  var cos = null;              // el cos del modal, mentre és obert

  function desa() {
    Cau.set('xat.missatges', missatges.slice(-30));
    Cau.set('xat.id', idConversa);
  }

  /* ------------------------------------------------------------- pintar */

  /**
   * El text del model, llegible.
   *
   * Escriu amb asteriscos i guions perquè és el que ha après, i sense això a
   * la pantalla hi surten els asteriscos. S'escapa PRIMER i es formata
   * després: al revés, un text amb un `<` s'hi colaria com a etiqueta.
   */
  function formata(text) {
    var t = esc(String(text || '')).trim();
    t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
         .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<i>$2</i>')
         .replace(/`([^`]+)`/g, '<code>$1</code>');
    return t.split('\n').map(function (l) {
      var m = l.match(/^\s*[-•]\s+(.*)$/);
      return m ? '<span class="xat-punt">' + m[1] + '</span>' : l;
    }).join('\n');
  }

  function bombolla(m, i) {
    if (m.rol === 'usuari') {
      return '<div class="xat-meu"><p>' + esc(m.text) + '</p></div>';
    }
    var h = '<div class="xat-seu"><p>' + formata(m.text) + '</p>';
    (m.propostes || []).forEach(function (p, j) {
      h += '<div class="xat-proposta" data-m="' + i + '" data-p="' + j + '">' +
        '<p>' + esc(p.etiqueta) + '</p>' +
        (p.resolta
          ? '<p class="xat-fi" data-com="' + esc(p.com || '') + '">' + esc(finalDe(p)) + '</p>'
          : '<div class="xat-accions">' +
              '<button class="btn btn-primari" data-si="1">Fes-ho</button>' +
              '<button class="btn btn-secundari" data-no="1">Deixa-ho</button>' +
            '</div>') +
      '</div>';
    });
    return h + '</div>';
  }

  function finalDe(p) {
    if (p.com === 'fet') return 'Fet.';
    if (p.com === 'descartat') return 'Descartat.';
    return p.com || 'No s\'ha pogut fer.';
  }

  function pinta() {
    if (!cos) return;
    var fil = cos.querySelector('#xat-fil');
    if (!fil) return;
    fil.innerHTML = missatges.length
      ? missatges.map(bombolla).join('')
      : '<p class="xat-buit">Pregunta-li el que vulguis de les teves dades. ' +
        'Contesta amb el que hi ha apuntat, no amb el que es pensa.</p>';
    if (ocupat) fil.innerHTML += '<div class="xat-pensa"><i></i><i></i><i></i></div>';
    fil.scrollTop = fil.scrollHeight;
    lliga();

    var b = cos.querySelector('#xat-envia');
    if (b) b.disabled = ocupat;
  }

  /* ----------------------------------------------------- les propostes */

  function lliga() {
    cos.querySelectorAll('.xat-proposta').forEach(function (el) {
      var m = missatges[Number(el.dataset.m)];
      var p = m && m.propostes ? m.propostes[Number(el.dataset.p)] : null;
      if (!p || p.resolta) return;

      el.querySelector('[data-no]').addEventListener('click', function () {
        p.resolta = true; p.com = 'descartat'; desa(); pinta();
      });
      el.querySelector('[data-si]').addEventListener('click', function (ev) {
        ev.currentTarget.disabled = true;
        ev.currentTarget.textContent = 'Desant…';
        crida('conversa', 'confirma', { eina: p.eina, args: p.args })
          .then(function () {
            p.resolta = true; p.com = 'fet';
            /* Acaba d'escriure una dada: el que hi ha desat d'aquell mòdul ja
               no val. Sense això, obrir-lo just després ensenya el de fa una
               estona. El mòdul ve amb la proposta, o sigui que un mòdul nou
               no ha de tocar res d'aquí. */
            if (p.modul) Cau.oblida(p.modul);
            Cau.treu('inici');
            desa(); pinta();
            App.brindis('Fet');
          })
          .catch(function (err) {
            p.resolta = true; p.com = err.message;
            desa(); pinta();
          });
      });
    });
  }

  /* --------------------------------------------------------- preguntar */

  function envia(text) {
    if (!text || ocupat) return;
    missatges.push({ rol: 'usuari', text: text });
    ocupat = true;
    pinta();

    crida('conversa', 'envia', { text: text, id_conversa: idConversa })
      .then(function (r) {
        idConversa = r.id_conversa || idConversa;
        missatges.push({
          rol: 'assistent',
          text: r.error || r.resposta || 'No n\'he tret res.',
          propostes: r.propostes || []
        });
        ocupat = false; desa(); pinta();

        /* UNA EINA POT DEMANAR QUE S'OBRI UNA PANTALLA. És com «ensenya'm el
           dia» acaba ensenyant-lo. Es tanca el calaix primer: deixar-lo obert
           a sobre del que acabes de demanar que t'ensenyi no té sentit. */
        var obre = (r.eines || []).filter(function (e) { return e.obre; })[0];
        if (obre && App.vistes[obre.obre]) {
          setTimeout(function () {
            App.tancaModal();
            App.ves(obre.obre, obre.obreAmb || null);
          }, 700);
          return;
        }
        var mostra = (r.eines || []).filter(function (e) { return e.mostra || e.visor; })[0];
        if (mostra) {
          setTimeout(function () {
            App.tancaModal();
            if (mostra.visor) App.obreVisor('nucli.dades', mostra.visor);
            else App.obreVisor(mostra.mostra, mostra.obreAmb || null);
          }, 700);
        }
      })
      .catch(function (err) {
        missatges.push({ rol: 'assistent', text: err.message });
        ocupat = false; desa(); pinta();
      });
  }

  /* ------------------------------------------------------------- obrir */

  function obre() {
    missatges = Cau.get('xat.missatges', []) || [];
    idConversa = Cau.get('xat.id', null);

    cos = App.modal('Pregunta a JEFE',
      '<div class="xat">' +
        /* `role="log"` amb `aria-live`: la resposta arriba sola, i qui no
           mira la pantalla també se n'ha d'assabentar. Educat i no
           «assertive»: no ha d'interrompre el que estiguis escoltant. */
        '<div class="xat-fil" id="xat-fil" role="log" aria-live="polite" ' +
          'aria-label="Conversa amb JEFE"></div>' +
        '<form class="xat-peu" id="xat-peu">' +
          '<input class="entrada" id="xat-camp" autocomplete="off" ' +
            'placeholder="Què vols saber?" aria-label="La teva pregunta">' +
          '<button class="btn btn-primari" id="xat-envia" type="submit">Pregunta</button>' +
        '</form>' +
        '<button class="xat-neteja" id="xat-neteja" type="button">Comença de nou</button>' +
      '</div>',
      function () { cos = null; });

    pinta();

    cos.querySelector('#xat-peu').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var camp = cos.querySelector('#xat-camp');
      var t = camp.value.trim();
      camp.value = '';
      envia(t);
    });

    cos.querySelector('#xat-neteja').addEventListener('click', function () {
      missatges = []; idConversa = null; desa(); pinta();
      cos.querySelector('#xat-camp').focus();
    });
  }

  return { obre: obre };
})();

(function () {
  var b = document.getElementById('b-jefe');
  if (b) b.addEventListener('click', Xat.obre);
})();
</script>
