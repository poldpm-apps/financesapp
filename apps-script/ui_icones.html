  <!-- LES ICONES DE FINANCES. Totes de traç, amb un sol gruix, com les de
       les germanes. La marca és el tall de la icona de l'app. Les que no fa
       servir ningú es treuen amb `eines/sobrant.mjs`, una per una. -->

  <!-- Seguiment físic: el braç fent bola. Aquesta icona la vaig perdre en una
       neteja —esborrant els símbols de mapa vaig tallar per rang de línies i
       se la va endur pel mig—, i la targeta de Seguiment va quedar sense. Per
       això ara les proves obren també el tauler d'apartats: allà hi surten
       totes les icones de mòdul alhora i una que falti es veu de seguida. -->
  <symbol id="ic-seguiment" viewBox="0 0 24 24">
    <rect x="3.4" y="3.6" width="17.2" height="16.8" rx="2.6"/>
    <path d="M8.4 8h7.2v3.8H8.4z"/>
    <path d="M7.4 15.6h3.2M13.4 15.6h3.2"/>
  </symbol>

       pantalla quan aquell aparell encara no en rep cap. -->

    <path d="M6.2 9.4a5.8 5.8 0 0 1 11.6 0c0 4 1.4 5.4 2 6H4.2c.6-.6 2-2 2-6z"/>

  <!-- LA MARCA, dibuixada per ser petita.
       El logo de debò —icona.svg— són 512 píxels amb degradats, raigs i dos
       anells: en un botó de 56 es converteix en una taca. Això és el mateix
       senyal reduït al que encara es llegeix a aquella mida: la muntanya, el
       far encès al cim i l'anell del sistema. Mateix traç que la resta de la
       simbologia, perquè és una icona i no un adhesiu. -->

    <path d="M2.6 19.4h18.8"/>
    <path d="M4.6 19.4 12 8.2l7.4 11.2"/>
    <path d="M9.6 15h4.8"/>

    <path d="M8.7 5a3.3 3.3 0 0 1 .9-2.3M15.3 5a3.3 3.3 0 0 0-.9-2.3"/>
  </symbol>

  <!-- ============================================================ HÀBITS ====
       Aquí hi havia simbologia de mapa —cim, font, refugi, gual—, repartida
       entre els hàbits amb un hash del seu identificador. Vol dir que «Llegir»
       podia sortir amb una cova i «Aigua» amb un pont: el símbol no deia res
       de l'hàbit, i per tant no servia per trobar-lo a la llista, que és
       l'única feina que té.

       Aquestes surten del NOM. Un got per beure aigua, un llibre per llegir,
       un cigarro per fumar. I quan un nom no s'assembla a res del que hi ha
       aquí, no se n'inventa cap: es dibuixa la inicial. Una lletra sempre vol
       dir alguna cosa; un pont, per a l'hàbit de llegir, no. -->




  <!-- La pàgina del dia: la i d'informació. És l'única pantalla que no és un
       mòdul i no tenia icona pròpia: al tauler d'apartats agafava la de
       l'inici, que és una altra cosa. -->
  <symbol id="ic-dia" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.6"/>
    <path d="M12 11.2v5.6"/>
    <path d="M12 7.6v.01"/>
