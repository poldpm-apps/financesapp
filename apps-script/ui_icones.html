  <!-- Seguiment físic: el braç fent bola. Aquesta icona la vaig perdre en una
       neteja —esborrant els símbols de mapa vaig tallar per rang de línies i
       se la va endur pel mig—, i la targeta de Seguiment va quedar sense. Per
       això ara les proves obren també el tauler d'apartats: allà hi surten
       totes les icones de mòdul alhora i una que falti es veu de seguida. -->

       que parla el mateix idioma que el fons de corbes de nivell. -->

       dos cercles enllaçats: el que s'ensenya en aquella pantalla és

       altre dibuix hauria promès un vincle que allà no s'afirma mai. -->

         apagar coses per distingir-les, i a 22 píxels una línia a mig gas no
         és una segona sèrie: és una línia que no es veu. El que les separa
         és que una va a sobre de l'altra, que és el que es vol dir. -->

       aquella pantalla: set dies l'un al costat de l'altre. La del mig és més
       alta perquè la fila tingui un centre i no sembli un pinta. -->
